<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Blecaco：连接 Android 手机与 Blender 的开源相机控制项目。">
  <title>Blecaco — Blender 相机控制</title>
  <style>
    :root {
      --page-bg: #ffffff;
      --text: #202124;
      --muted: #6b7280;
      --blue: #1868db;
      --blue-hover: #0f56bd;
      --gray-button: #666666;
      --gray-button-hover: #505050;
      --video-bg: #181818;
      --frame-radius: 10px;
      --button-radius: 999px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(80vw, 1200px);
      margin: 0 auto;
      padding-top: clamp(24px, 7.8vh, 76px);
      padding-bottom: 48px;
    }

    /* 居中的宽幅 Bilibili 播放区域 */
    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: var(--frame-radius);
      background: var(--video-bg);
      box-shadow: 0 8px 28px rgb(0 0 0 / 10%);
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--video-bg);
    }

    /* 三个按钮在视频正下方，整体水平居中并保持同一行 */
    .actions {
      width: 100%;
      margin: clamp(18px, 3vh, 30px) auto 0;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2.4vw, 28px);
    }

    .button {
      flex: 0 1 auto;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px clamp(14px, 2vw, 26px);
      border: 0;
      border-radius: var(--button-radius);
      color: #ffffff;
      font: inherit;
      font-size: clamp(12px, 1.25vw, 16px);
      font-weight: 500;
      text-align: center;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    .button:hover { transform: translateY(-1px); }
    .button:focus-visible { outline: 3px solid #91baff; outline-offset: 3px; }
    .button-home { background: var(--gray-button); }
    .button-home:hover { background: var(--gray-button-hover); }
    .button-download { background: var(--blue); }
    .button-download:hover { background: var(--blue-hover); }

    .notice {
      min-height: 24px;
      margin: 14px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .notice:empty { display: none; }

    @media (max-width: 760px) {
      main {
        width: min(92vw, 680px);
        padding-top: 28px;
      }

      .actions {
        gap: 10px;
        margin-top: 20px;
      }

      .button {
        min-height: 44px;
        padding: 9px 12px;
        font-size: clamp(11px, 2.7vw, 14px);
      }
    }

    @media (max-width: 360px) {
      .actions { gap: 6px; }
      .button { padding: 8px 7px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <!-- 填入 B 站视频链接后，播放器会显示在这里；没有配置时保留纯色视频区域。 -->
    <section class="video-frame" aria-label="Blecaco 视频介绍">
      <iframe
        id="bilibili-player"
        title="Blecaco 视频介绍（哔哩哔哩）"
        allow="fullscreen; picture-in-picture; autoplay; clipboard-write; encrypted-media; web-share"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
        loading="lazy"
        hidden>
      </iframe>
    </section>

    <!-- 三个按钮：同一行、整体居中、位于视频下方。 -->
    <nav class="actions" aria-label="主要链接">
      <a class="button button-home" id="homepage-link" href="https://github.com/CantanTam/" target="_blank" rel="noopener noreferrer">我的主页</a>
      <a class="button button-download" id="app-link" href="#download-app">下载 APP</a>
      <a class="button button-download" id="addon-link" href="#download-addon">下载 ADDON</a>
    </nav>
    <p class="notice" id="notice" role="status" aria-live="polite"></p>
  </main>

  <script>
    /* 后续只需修改这里，不必改动页面布局：
       BILIBILI_VIDEO_URL 可以填写：
       1. B 站普通视频链接，例如 https://www.bilibili.com/video/BVxxxxxxxxxx/
       2. BV 号，例如 BVxxxxxxxxxx
       3. B 站嵌入播放器地址，例如 https://player.bilibili.com/player.html?... 
       APP_DOWNLOAD_URL 和 ADDON_DOWNLOAD_URL 填写对应 GitHub 仓库的 Releases 地址或直接下载链接。
    */
    const SITE_CONFIG = {
      BILIBILI_VIDEO_URL: "https://www.bilibili.com/video/BV1qD4y1U7fs/",
      BILIBILI_PAGE: 1,
      HOMEPAGE_URL: "https://github.com/CantanTam/",
      APP_DOWNLOAD_URL: "",
      ADDON_DOWNLOAD_URL: ""
    };

    const player = document.getElementById("bilibili-player");
    const homepageLink = document.getElementById("homepage-link");
    const appLink = document.getElementById("app-link");
    const addonLink = document.getElementById("addon-link");
    const notice = document.getElementById("notice");

    homepageLink.href = SITE_CONFIG.HOMEPAGE_URL;

    function getBilibiliPlayerUrl(input, fallbackPage = 1) {
      const value = input.trim();
      if (!value) return "";

      // 用户已经提供完整的嵌入播放器地址时，直接使用。
      if (/^https?:\/\/player\.bilibili\.com\//i.test(value)) return value;

      // 普通视频链接或单独 BV 号都可以；如果链接带有 ?p=2，会读取分 P 序号。
      const bvidMatch = value.match(/BV[0-9A-Za-z]+/);
      if (!bvidMatch) return "";

      let page = fallbackPage;
      try {
        if (/^https?:\/\//i.test(value)) {
          const parsed = new URL(value);
          const pageParam = Number.parseInt(parsed.searchParams.get("p"), 10);
          if (Number.isFinite(pageParam) && pageParam > 0) page = pageParam;
        }
      } catch (_) {
        // 如果无法解析为完整 URL，则仍尝试使用 BV 号。
      }

      return `https://player.bilibili.com/player.html?bvid=${encodeURIComponent(bvidMatch[0])}&page=${page}&danmaku=0&autoplay=0`;
    }

    const playerUrl = getBilibiliPlayerUrl(
      SITE_CONFIG.BILIBILI_VIDEO_URL,
      SITE_CONFIG.BILIBILI_PAGE
    );

    if (playerUrl) {
      player.src = playerUrl;
      player.hidden = false;
    }

    function configureLink(link, url, label) {
      if (url && url.trim()) {
        link.href = url.trim();
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      } else {
        link.href = "#";
        link.addEventListener("click", (event) => {
          event.preventDefault();
          notice.textContent = `${label}链接尚未设置；之后在 index.html 底部的 SITE_CONFIG 中填写对应地址即可。`;
        });
      }
    }

    configureLink(appLink, SITE_CONFIG.APP_DOWNLOAD_URL, "Android APP 下载");
    configureLink(addonLink, SITE_CONFIG.ADDON_DOWNLOAD_URL, "Blender 插件下载");
  </script>
</body>
</html>
